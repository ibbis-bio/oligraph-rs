name: Python

on:
  push:
    branches: [main]
    tags: ["py-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref, but never cancel a tagged release
# midway through publishing.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2

      # Writer parity tests: the labelled writers must match the core writers
      # byte for byte. Linking the test binary needs a shared libpython, so point
      # pyo3 at the interpreter setup-python just installed.
      - name: cargo test
        shell: bash
        run: |
          export PYO3_PYTHON="$(which python)"
          LIBDIR="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          export LD_LIBRARY_PATH="$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$LIBDIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          cargo test -p oligraph-py -p oligraph-rs

      # Enables the CLI byte-for-byte parity test in the pytest suite.
      - name: Build CLI
        run: cargo build -p oligraph-rs --release

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: pytest
        run: python -m pytest tests -q

  wheels:
    name: wheel (${{ matrix.platform.os }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # abi3-py39 means one wheel per platform covers every Python from 3.9 up.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # A PyPI version can never be replaced, so refuse to publish when the tag and
  # the package version disagree.
  check-version:
    name: tag matches package version
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with python/Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          pkg=$(grep -m1 '^version = ' python/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag py-v$tag does not match version $pkg in python/Cargo.toml"
            exit 1
          fi

  # Trusted Publishing (OIDC): no API token is stored anywhere. The `pypi`
  # environment is where a required-reviewer rule can gate the upload.
  pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [check-version, test, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oligraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Validate metadata before upload
        run: pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Same artefacts also attached to the GitHub Release, so a wheel stays
  # installable by URL without going through PyPI.
  release:
    name: attach wheels to release
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [check-version, test, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
