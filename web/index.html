<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OliGraph</title>
    <link data-trunk rel="icon" href="favicon.svg" />
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
      :root {
        --bg: #0b0d11;
        --panel: #15191f;
        --panel-hover: #1c222a;
        --border: #2d343f;
        --border-bright: #3f4754;
        --text: #f0f2f5;
        --muted: #8b95a5;
        --accent: #60a5fa;
        --accent-glow: rgba(96, 165, 250, 0.3);
        --pass: #4ade80;
        --warn: #fbbf24;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
        --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.5), 0 2px 6px -1px rgba(0,0,0,0.3);
        --radius: 8px;
        --font-mono: "SF Mono", "ui-monospace", "Monaco", "Consolas", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main { 
        max-width: 1024px; 
        margin: 0 auto; 
        padding: 3rem 1.5rem; 
        display: flex; 
        flex-direction: column; 
        flex: 1;
        width: 100%;
      }
      
      h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
      h2 { font-size: 1.15rem; color: var(--text); }
      
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-md);
        animation: fade-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      
      .row { display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: end; justify-content: center; }
      .field { display: flex; flex-direction: column; gap: 0.4rem; }
      .field label { font-size: 0.8rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      
      input[type="number"], select, input[type="file"] {
        background: #090b0f;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        font-size: 0.9rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
      }
      input[type="number"]:focus, select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      
      input[type="file"] { padding: 0.4rem; cursor: pointer; }
      input[type="file"]::file-selector-button {
        background: var(--border);
        color: var(--text);
        border: none;
        padding: 0.3rem 0.6rem;
        border-radius: 4px;
        margin-right: 0.75rem;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      input[type="file"]:hover::file-selector-button { background: var(--border-bright); }

      button {
        background: linear-gradient(180deg, #74b1fb 0%, var(--accent) 100%);
        color: #05070a;
        border: none;
        border-radius: 6px;
        padding: 0.55rem 1.25rem;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
        box-shadow: var(--shadow-sm);
      }
      button:not(:disabled):hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(96, 165, 250, 0.2); }
      button:not(:disabled):active { transform: translateY(0); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.5); }

      .btn-secondary {
        background: var(--border);
        color: var(--text);
        font-size: 0.85rem;
        padding: 0.4rem 0.8rem;
      }
      .btn-secondary:not(:disabled):hover {
        background: var(--border-bright);
        box-shadow: none;
      }

      table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; }
      th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(0,0,0,0.1); }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: rgba(255,255,255,0.02); }
      td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
      
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
      .stat { padding: 1rem; background: rgba(0,0,0,0.15); border-radius: 6px; border: 1px solid rgba(255,255,255,0.03); }
      .stat .k { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
      .stat .v { font-size: 1.35rem; font-weight: 700; font-family: var(--font-mono); color: var(--text); }
      
      .err { color: #ff8080; background: rgba(255,128,128,0.1); padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid rgba(255,128,128,0.2); margin: 1rem 0 0; font-size: 0.9rem; }
      code { background: #090b0f; padding: 2px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); }

      .graph-container {
        position: relative;
        background: #060709;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .graph-grid {
        pointer-events: none;
        stroke: rgba(255,255,255,0.03);
        stroke-width: 1;
      }

      /* Logo & Icon Animations */
      .logo-icon-container {
        transform-origin: center;
      }

      @keyframes helix-to-graph-helix {
        0%       { opacity: 1; transform: scale(1) rotate(0deg); }
        45%, 100% { opacity: 0; transform: scale(0.7) rotate(-45deg); }
      }
      @keyframes helix-to-graph-graph {
        0%, 45%  { opacity: 0; transform: scale(0.6) rotate(45deg); filter: blur(4px); }
        100%     { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
      }
      @keyframes node-bloom {
        0%, 50%  { transform: scale(0); filter: brightness(2); }
        80%      { transform: scale(1.2); }
        100%     { transform: scale(1); filter: brightness(1); }
      }
      @keyframes edge-flow {
        0%       { stroke-dashoffset: 20; opacity: 0.2; }
        50%      { opacity: 0.6; }
        100%     { stroke-dashoffset: 0; opacity: 0.2; }
      }

      .logo-helix { animation: helix-to-graph-helix 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: 22px 22px; }
      .logo-graph { animation: helix-to-graph-graph 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: 22px 22px; }
      .logo-graph circle { animation: node-bloom 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; transform-origin: center; transform-box: fill-box; }
      .logo-graph circle:nth-child(4) { animation-delay: 0.1s; }
      .logo-graph circle:nth-child(5) { animation-delay: 0.2s; }
      .logo-graph circle:nth-child(6) { animation-delay: 0.3s; }
      .logo-graph circle:nth-child(7) { animation-delay: 0.4s; }
      
      .logo-edge-flow {
        stroke-dasharray: 4 4;
        animation: edge-flow 3s linear infinite 2.5s;
      }

      /* Wordmark Shimmer */
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .logo-wordmark {
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(90deg, #fff 0%, #60a5fa 25%, #fff 50%, #60a5fa 75%, #fff 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 8s linear infinite;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .logo-wordmark {
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #fff 30%, #60a5fa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--muted);
        transition: all 0.2s;
      }
      .chip:hover { border-color: var(--border-bright); color: var(--text); background: rgba(255,255,255,0.07); }

      @keyframes dot-pulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%           { opacity: 1; transform: scale(1); }
      }
      .dot { animation: dot-pulse 1.4s ease-in-out infinite; display: inline-block; color: var(--accent); }
    </style>

  </head>
  <body></body>
</html>
