[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "oligraph"
dynamic = ["version"]
description = "Overlap graph builder and contig assembler for oligonucleotide pools"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 SPDX expression. Note that a "License ::" trove classifier must NOT be
# added alongside this — PyPI rejects the combination.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bioinformatics", "dna", "assembly", "overlap-graph", "oligonucleotide", "gfa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Console entry point. The Rust CLI binary cannot ship inside a pyo3 extension
# wheel, so this is a Python front-end over the same bindings.
[project.scripts]
oligraph = "oligraph.__main__:main"

[project.urls]
Homepage = "https://github.com/AgentK9/oligraph-rs"
Repository = "https://github.com/AgentK9/oligraph-rs"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "oligraph._oligraph"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
