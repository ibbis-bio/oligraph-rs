[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "oligraph"
dynamic = ["version"]
description = "Overlap graph builder and contig assembler for oligonucleotide pools"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["bioinformatics", "dna", "assembly", "overlap-graph", "oligonucleotide", "gfa"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/AgentK9/oligraph-rs"
Repository = "https://github.com/AgentK9/oligraph-rs"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "oligraph._oligraph"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
